<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11111b">
  <title>وَنَس | بث مباشر</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at top, #39205f 0, transparent 45%),
        #11111b;
      color: #fff;
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(90%, 420px);
      padding: 32px 24px;
      text-align: center;
      border: 1px solid #ffffff18;
      border-radius: 24px;
      background: #191923;
      box-shadow: 0 20px 60px #0005;
    }

    .logo { font-size: 48px; }

    h1 { margin: 8px 0; }

    p {
      color: #c4c1d0;
      line-height: 1.8;
    }

    .mic-button {
      width: 82px;
      height: 82px;
      margin: 22px auto 10px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: #35244e;
      color: white;
      font-size: 34px;
      cursor: pointer;
    }

    .mic-button.active { background: #7c3aed; }
    .mic-button:disabled { opacity: .6; cursor: wait; }

    .actions {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    button.action {
      width: 100%;
      padding: 13px 18px;
      border: 0;
      border-radius: 12px;
      background: #7c3aed;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button.action.secondary {
      background: #302d3a;
    }

    button:focus-visible {
      outline: 3px solid #c4b5fd;
      outline-offset: 3px;
    }

    #status {
      min-height: 48px;
      margin-top: 16px;
      font-size: 14px;
    }

    .note {
      margin-top: 18px;
      font-size: 12px;
      color: #a6a4b5;
    }
  </style>
</head>

<body>
  <main>
    <div class="logo" aria-hidden="true">🎙️</div>
    <h1>وَنَس</h1>
    <p>اضغط الزر لتشغيل المايكروفون أو كتمه.</p>

    <button
      id="micButton"
      class="mic-button"
      type="button"
      aria-label="تشغيل المايكروفون"
      aria-pressed="false"
    >🎤</button>

    <div class="actions">
      <button id="startButton" class="action" type="button">
        تشغيل المايكروفون
      </button>
      <button id="stopButton" class="action secondary" type="button" hidden>
        إيقاف المايكروفون
      </button>
    </div>

    <p id="status" role="status" aria-live="polite">الميكروفون متوقف.</p>
    <p class="note">السماح للمتصفح باستخدام المايكروفون مطلوب.</p>
  </main>

  <script>
    const micButton = document.getElementById("micButton");
    const startButton = document.getElementById("startButton");
    const stopButton = document.getElementById("stopButton");
    const statusText = document.getElementById("status");

    let micStream = null;
    let isMuted = false;

    async function startMicrophone() {
      if (!navigator.mediaDevices?.getUserMedia) {
        statusText.textContent =
          "المتصفح لا يدعم المايكروفون هنا. افتح الموقع عبر HTTPS في متصفح حديث.";
        return;
      }

      startButton.disabled = true;
      statusText.textContent = "جارٍ طلب إذن المايكروفون…";

      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        isMuted = false;
        updateInterface();
        statusText.textContent =
          "الميكروفون يعمل على جهازك. لا يوجد بث مباشر للآخرين.";
      } catch (error) {
        if (error.name === "NotAllowedError" ||
            error.name === "PermissionDeniedError") {
          statusText.textContent =
            "لم يُسمح باستخدام المايكروفون. غيّر إذن المايك من إعدادات المتصفح ثم حاول مجددًا.";
        } else if (error.name === "NotFoundError") {
          statusText.textContent = "لم يتم العثور على مايكروفون متصل بالجهاز.";
        } else {
          statusText.textContent =
            "تعذّر تشغيل المايكروفون. تحقق من الإذن وحاول مرة أخرى.";
        }
      } finally {
        startButton.disabled = false;
      }
    }

    function toggleMute() {
      if (!micStream) {
        startMicrophone();
        return;
      }

      isMuted = !isMuted;
      micStream.getAudioTracks().forEach(track => {
        track.enabled = !isMuted;
      });

      updateInterface();
      statusText.textContent = isMuted
        ? "الميكروفون مكتوم."
        : "الميكروفون يعمل على جهازك. لا يوجد بث مباشر للآخرين.";
    }

    function stopMicrophone() {
      if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
        micStream = null;
      }

      isMuted = false;
      updateInterface();
      statusText.textContent
