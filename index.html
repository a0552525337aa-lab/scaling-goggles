<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11111b">
  <title>وَنَس | دردشة ومايك</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top, #39205f 0, transparent 45%),
        #11111b;
      color: #fff;
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(100% - 28px, 760px);
      margin: 24px auto;
    }

    header,
    .panel {
      border: 1px solid #ffffff18;
      border-radius: 18px;
      background: #191923;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    .subtitle,
    .hint {
      color: #aaa8b8;
      font-size: 13px;
    }

    .badge {
      padding: 7px 10px;
      border-radius: 20px;
      background: #30233f;
      color: #d8b4fe;
      font-size: 12px;
      white-space: nowrap;
    }

    .panel {
      padding: 18px;
    }

    .mic-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding-bottom: 16px;
      border-bottom: 1px solid #ffffff16;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 11px;
      padding: 11px 15px;
      color: #fff;
      background: #7c3aed;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.12);
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #c4b5fd;
      outline-offset: 2px;
    }

    button.secondary {
      background: #34313e;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    [hidden] {
      display: none !important;
    }

    #micStatus {
      color: #c4c1d0;
      font-size: 13px;
      line-height: 1.6;
    }

    h2 {
      margin: 18px 0 12px;
      font-size: 18px;
    }

    #messages {
      height: min(48vh, 390px);
      min-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
      border-radius: 12px;
      background: #11111b;
    }

    .empty {
      margin: auto;
      color: #9693a5;
      text-align: center;
    }

    .message {
      max-width: 85%;
      align-self: flex-start;
      padding: 10px 12px;
      border-radius: 12px 12px 12px 3px;
      background: #282435;
      overflow-wrap: anywhere;
    }

    .message time {
      display: block;
      margin-top: 5px;
      color: #aaa8b8;
      font-size: 11px;
    }

    form {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ffffff20;
      border-radius: 11px;
      outline: none;
      background: #11111b;
      color: #fff;
    }

    input::placeholder {
      color: #898697;
    }

    .hint {
      margin: 12px 2px 0;
      line-height: 1.7;
    }

    @media (max-width: 480px) {
      main {
        margin: 12px auto;
      }

      header {
        padding: 14px;
      }

      .panel {
        padding: 13px;
      }

      #messages {
        height: 45vh;
      }

      form button {
        padding-inline: 13px;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div>
        <h1>وَنَس</h1>
        <div class="subtitle">مساحة للدردشة والتواصل</div>
      </div>
      <span class="badge">نسخة تجريبية</span>
    </header>

    <section class="panel" aria-label="الدردشة والمايكروفون">
      <div class="mic-row">
        <button id="micButton" type="button">🎤 تشغيل المايك</button>

        <button
          id="muteButton"
          class="secondary"
          type="button"
          aria-pressed="false"
          hidden
        >
          كتم المايك
        </button>

        <button
          id="stopMicButton"
          class="secondary"
          type="button"
          hidden
        >
          إيقاف المايك
        </button>

        <div id="micStatus" role="status" aria-live="polite">
          المايكروفون متوقف.
        </div>
      </div>

      <h2>الدردشة</h2>

      <div id="messages" aria-live="polite">
        <div id="emptyMessage" class="empty">
          لا توجد رسائل بعد. اكتب أول رسالة 👋
        </div>
      </div>

      <form id="chatForm">
        <input
          id="messageInput"
          type="text"
          maxlength="500"
          placeholder="اكتب رسالتك هنا..."
          aria-label="اكتب رسالتك"
          autocomplete="off"
          required
        >
        <button type="submit">إرسال</button>
      </form>

      <p class="hint">
        ملاحظة: الرسائل تظهر في هذه الصفحة على جهازك فقط، ولا تصل لمستخدمين آخرين.
        المايك يطلب إذن المتصفح، لكنه لا ينشئ بثًا صوتيًا مباشرًا.
      </p>
    </section>
  </main>

  <script>
    const chatForm = document.getElementById("chatForm");
    const messageInput = document.getElementById("messageInput");
    const messages = document.getElementById("messages");
    const emptyMessage = document.getElementById("emptyMessage");

    const micButton = document.getElementById("micButton");
    const muteButton = document.getElementById("muteButton");
    const stopMicButton = document.getElementById("stopMicButton");
    const micStatus = document.getElementById("micStatus");
