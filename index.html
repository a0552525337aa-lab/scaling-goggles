<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11111b">
  <title>وَنَس | دردشة ومايك</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #11111b;
      color: #fff;
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(760px, calc(100% - 28px));
      margin: 24px auto;
    }

    header, .panel {
      border: 1px solid #ffffff20;
      border-radius: 18px;
      background: #191923;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      margin-bottom: 14px;
    }

    h1 { margin: 0; font-size: 22px; }
    h2 { margin: 18px 0 12px; font-size: 18px; }

    .subtitle, .hint {
      color: #aaa8b8;
      font-size: 13px;
    }

    .badge {
      padding: 7px 10px;
      border-radius: 20px;
      background: #30233f;
      color: #d8b4fe;
      font-size: 12px;
    }

    .panel { padding: 18px; }

    .mic-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding-bottom: 16px;
      border-bottom: 1px solid #ffffff20;
    }

    button, input { font: inherit; }

    button {
      border: 0;
      border-radius: 11px;
      padding: 11px 15px;
      color: white;
      background: #7c3aed;
      cursor: pointer;
    }

    button.secondary { background: #34313e; }
    button:disabled { opacity: .6; cursor: wait; }
    [hidden] { display: none !important; }

    #micStatus {
      color: #c4c1d0;
      font-size: 13px;
      line-height: 1.6;
    }

    #messages {
      height: min(48vh, 390px);
      min-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      padding: 12px;
      border-radius: 12px;
      background: #11111b;
    }

    .empty {
      align-self: center;
      margin: auto;
      color: #9693a5;
      text-align: center;
    }

    .message {
      max-width: 85%;
      padding: 10px 12px;
      border-radius: 12px 12px 12px 3px;
      background: #282435;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .message time {
      display: block;
      margin-top: 5px;
      color: #aaa8b8;
      font-size: 11px;
    }

    form {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ffffff30;
      border-radius: 11px;
      background: #11111b;
      color: #fff;
    }

    input::placeholder { color: #aaa8b8; }

    .hint {
      margin: 12px 2px 0;
      line-height: 1.7;
    }

    @media (max-width: 480px) {
      main { margin: 12px auto; }
      header, .panel { padding: 14px; }
      #messages { height: 45vh; }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div>
        <h1>وَنَس</h1>
        <div class="subtitle">مساحة للدردشة والتواصل</div>
      </div>
      <span class="badge">نسخة تجريبية</span>
    </header>

    <section class="panel">
      <div class="mic-row">
        <button id="micButton" type="button">🎤 تشغيل المايك</button>
        <button id="muteButton" class="secondary" type="button" hidden>
          كتم المايك
        </button>
        <button id="stopMicButton" class="secondary" type="button" hidden>
          إيقاف المايك
        </button>
        <div id="micStatus" role="status" aria-live="polite">
          المايكروفون متوقف.
        </div>
      </div>

      <h2>الدردشة</h2>

      <div id="messages" aria-live="polite">
        <div id="emptyMessage" class="empty">
          لا توجد رسائل بعد. اكتب أول رسالة 👋
        </div>
      </div>

      <form id="chatForm">
        <input
          id="messageInput"
          type="text"
          maxlength="500"
          placeholder="اكتب رسالتك هنا..."
          aria-label="اكتب رسالتك"
          autocomplete="off"
          required
        >
        <button type="submit">إرسال</button>
      </form>

      <p class="hint">
        الدردشة في هذه النسخة محلية على جهازك فقط، ولا تصل الرسائل إلى مستخدمين آخرين.
      </p>
    </section>
  </main>

  <script>
    const chatForm = document.getElementById("chatForm");
    const messageInput = document.getElementById("messageInput");
    const messages = document.getElementById("messages");
    const emptyMessage = document.getElementById("emptyMessage");

    chatForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const text = messageInput.value.trim();
      if (!text) return;

      if (emptyMessage && emptyMessage.isConnected) {
        emptyMessage.remove();
      }

      const bubble = document.createElement("div");
      bubble.className = "message";

      const messageText = document.createElement("div");
      messageText.textContent = text;
